name: Update border waits

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-border-waits:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Read HAK / MUP border waits
        run: python scripts/update_border_waits.py

      - name: Commit changed border waits
        shell: bash
        run: |
          if git diff --quiet -- border_waits.json; then
            echo "Nema promjene podataka. Nema commita."
            exit 0
          fi

          git config user.name "sta-sad-bot"
          git config user.email "sta-sad-bot@users.noreply.github.com"

          git add border_waits.json
          git commit -m "Auto-update border wait times"
          git push
