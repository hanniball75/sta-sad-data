name: Update Croatia tolls

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-tolls:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Read current HAC toll prices
        run: python scripts/update_croatia_tolls.py

      - name: Commit changed prices
        shell: bash
        run: |
          if git diff --quiet -- croatia_tolls.json; then
            echo "Nema promjene cijena. Nema commita."
            exit 0
          fi

          git config user.name "sta-sad-bot"
          git config user.email "sta-sad-bot@users.noreply.github.com"

          git add croatia_tolls.json
          git commit -m "Auto-update HAC toll prices"
          git push
