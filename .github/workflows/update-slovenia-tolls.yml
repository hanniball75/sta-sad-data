name: Update Slovenia tolls

on:
  workflow_dispatch:
  schedule:
    - cron: "27 3 * * *"

permissions:
  contents: write

jobs:
  update-slovenia-tolls:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Read Slovenia vignette and tunnel prices
        run: python scripts/update_slovenia_tolls.py

      - name: Commit changed Slovenia prices
        shell: bash
        run: |
          if git diff --quiet -- slovenia_tolls.json; then
            echo "Nema promjene cijena. Nema commita."
            exit 0
          fi

          git config user.name "sta-sad-bot"
          git config user.email "sta-sad-bot@users.noreply.github.com"

          git add slovenia_tolls.json
          git commit -m "Auto-update Slovenia toll prices"
          git push
